<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智匯記事與待辦管家</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <div id="app" class="min-h-screen flex flex-col md:flex-row">
        
        <!-- 側邊導覽列 -->
        <aside class="w-full md:w-64 bg-white dark:bg-slate-900 border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-indigo-600 text-white rounded-xl">
                            <i data-lucide="check-square" class="w-6 h-6"></i>
                        </div>
                        <span class="font-bold text-lg tracking-wide">智匯記事本</span>
                    </div>
                    <button onclick="toggleTheme()" class="md:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    </button>
                </div>

                <nav class="space-y-1">
                    <button onclick="filterCategory('all')" id="cat-all" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400">
                        <i data-lucide="layers" class="w-4 h-4"></i>
                        <span>全部項目</span>
                        <span id="count-all" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                    </button>

                    <button onclick="filterCategory('shopping')" id="cat-shopping" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-emerald-500"></i>
                        <span>🛒 待購清單</span>
                        <span id="count-shopping" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                    </button>

                    <button onclick="filterCategory('bill')" id="cat-bill" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="credit-card" class="w-4 h-4 text-amber-500"></i>
                        <span>💳 單次待繳費</span>
                        <span id="count-bill" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                    </button>

                    <button onclick="filterCategory('recurring')" id="cat-recurring" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="refresh-cw" class="w-4 h-4 text-purple-500"></i>
                        <span>🔄 定期繳費</span>
                        <span id="count-recurring" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                    </button>

                    <button onclick="filterCategory('reminder')" id="cat-reminder" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="bell" class="w-4 h-4 text-rose-500"></i>
                        <span>⏰ 定時提醒/待辦</span>
                        <span id="count-reminder" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                    </button>

                    <button onclick="filterCategory('note')" id="cat-note" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="file-text" class="w-4 h-4 text-blue-500"></i>
                        <span>📝 一般記事</span>
                        <span id="count-note" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                    </button>
                </nav>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
                <button onclick="toggleTheme()" class="hidden md:flex w-full items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                    <span>切換主題外觀</span>
                </button>
                <button onclick="exportData()" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>匯出備份 (JSON)</span>
                </button>
            </div>
        </aside>

        <!-- 主要畫面 -->
        <main class="flex-1 p-4 sm:p-8 space-y-6 overflow-y-auto">
            
            <div class="flex flex-col sm:flex-row gap-4 items-stretch sm:items-center justify-between">
                <div class="relative flex-1 max-w-md">
                    <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-3 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderItems()" placeholder="搜尋記事、繳費、待購項目..." 
                        class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button onclick="openAddModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>新增項目</span>
                </button>
            </div>

            <div id="shoppingSummary" class="hidden bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/50 p-4 rounded-2xl flex justify-between items-center text-sm text-emerald-800 dark:text-emerald-300">
                <span>🛒 待購小計總額：</span>
                <span class="font-bold text-lg font-mono" id="totalShoppingBudget">$0</span>
            </div>

            <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center space-y-3">
                <div class="p-4 rounded-full bg-slate-100 dark:bg-slate-900 text-slate-400">
                    <i data-lucide="inbox" class="w-10 h-10"></i>
                </div>
                <p class="text-slate-500 dark:text-slate-400 font-medium">尚無相關項目</p>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="itemModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-6 my-8 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
                <h3 class="text-lg font-bold" id="modalTitle">新增項目</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="itemId">

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">項目分類</label>
                    <select id="itemCategory" onchange="toggleFormFields()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="shopping">🛒 待購清單 (數量/小計)</option>
                        <option value="bill">💳 單次待繳費 (金額/到期日)</option>
                        <option value="recurring">🔄 定期繳費 (水電/瓦斯/貸款/保險)</option>
                        <option value="reminder">⏰ 定時提醒/待辦 (到期逾期標示)</option>
                        <option value="note">📝 一般記事</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">標題 / 項目名稱</label>
                    <input type="text" id="itemName" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                </div>

                <!-- 待購欄位 -->
                <div id="shoppingFields" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">預估單價 ($)</label>
                        <input type="number" id="itemPrice" min="0" placeholder="0" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">數量</label>
                        <input type="number" id="itemQuantity" min="1" value="1" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                    </div>
                </div>

                <!-- 繳費金額與定期種類 -->
                <div id="billFields" class="space-y-3">
                    <div id="recurringTypeGroup" class="hidden">
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">定期類別</label>
                        <select id="recurringType" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                            <option value="水費">💧 水費</option>
                            <option value="電費">⚡ 電費</option>
                            <option value="瓦斯費">🔥 瓦斯費</option>
                            <option value="房屋/汽車貸款">🏠 房屋/汽車貸款</option>
                            <option value="人壽/醫療保險費">🛡️ 人壽/醫療保險費</option>
                            <option value="網路/電信費">📡 網路/電信費</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">應繳金額 ($)</label>
                        <input type="number" id="billAmount" min="0" placeholder="0" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                    </div>
                </div>

                <!-- 日期與到期日 -->
                <div id="dateFields">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1" id="dateLabel">到期日 / 提醒時間</label>
                    <input type="date" id="dueDate" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">備註說明</label>
                    <textarea id="itemNotes" rows="3" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none"></textarea>
                </div>

                <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeModal()" class="flex-1 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">取消</button>
                    <button type="submit" class="flex-1 py-2.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-500/20">儲存項目</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let itemsData = JSON.parse(localStorage.getItem('smart_notes_data') || '[]');
        let activeCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderItems();
        });

        function initTheme() {
            if ((localStorage.getItem('theme') || 'dark') === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function toggleFormFields() {
            const cat = document.getElementById('itemCategory').value;
            document.getElementById('shoppingFields').classList.toggle('hidden', cat !== 'shopping');
            document.getElementById('billFields').classList.toggle('hidden', cat !== 'bill' && cat !== 'recurring');
            document.getElementById('recurringTypeGroup').classList.toggle('hidden', cat !== 'recurring');
            document.getElementById('dateFields').classList.toggle('hidden', cat === 'note' || cat === 'shopping');
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const today = new Date().toISOString().split('T')[0];
            grid.innerHTML = '';

            let shoppingSum = 0;

            const filtered = itemsData.filter(item => {
                const matchCat = activeCategory === 'all' || item.category === activeCategory;
                const matchSearch = item.name.toLowerCase().includes(search) || (item.notes && item.notes.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            // 更新計數器
            ['all', 'shopping', 'bill', 'recurring', 'reminder', 'note'].forEach(c => {
                const count = c === 'all' ? itemsData.length : itemsData.filter(i => i.category === c).length;
                document.getElementById(`count-${c}`).innerText = count;
            });

            document.getElementById('shoppingSummary').classList.toggle('hidden', activeCategory !== 'shopping');

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4";

                let badge = '';
                let extraContent = '';
                let isOverdue = item.dueDate && item.dueDate < today && !item.completed;

                if (item.category === 'shopping') {
                    const subtotal = (item.price || 0) * (item.quantity || 1);
                    shoppingSum += subtotal;
                    badge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-600 border border-emerald-500/20">🛒 待購</span>`;
                    extraContent = `<div class="font-mono text-xs text-slate-500">單價: $${item.price || 0} × ${item.quantity || 1} = <strong class="text-emerald-600 dark:text-emerald-400 font-bold">$${subtotal}</strong></div>`;
                } else if (item.category === 'bill') {
                    badge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-600 border border-amber-500/20">💳 待繳費</span>`;
                    extraContent = `<div class="font-mono text-xs text-amber-600 dark:text-amber-400 font-bold">金額: $${item.billAmount || 0}</div>`;
                } else if (item.category === 'recurring') {
                    badge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-600 border border-purple-500/20">🔄 ${item.recurringType || '定期'}</span>`;
                    extraContent = `<div class="font-mono text-xs text-purple-600 dark:text-purple-400 font-bold">扣款金額: $${item.billAmount || 0}</div>`;
                } else if (item.category === 'reminder') {
                    badge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-600 border border-rose-500/20">⏰ 提醒</span>`;
                } else {
                    badge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-600 border border-blue-500/20">📝 記事</span>`;
                }

                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-start justify-between gap-2">
                            <h4 class="font-bold text-base text-slate-900 dark:text-white ${item.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(item.name)}</h4>
                            ${badge}
                        </div>
                        ${extraContent}
                        ${item.dueDate ? `
                            <div class="text-xs ${isOverdue ? 'text-rose-500 font-bold' : 'text-slate-400'} flex items-center gap-1">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                <span>到期日: ${item.dueDate}${isOverdue ? '⚠️ 已逾期' : ''}</span>
                            </div>
                        ` : ''}
                        ${item.notes ? `<p class="text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl">${escapeHtml(item.notes)}</p>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
                        <button onclick="toggleComplete('${item.id}')" class="text-xs font-semibold ${item.completed ? 'text-emerald-500' : 'text-slate-400 hover:text-slate-600'}">
                            ${item.completed ? '✓ 已完成' : '○ 標記完成'}
                        </button>
                        <div class="flex gap-2">
                            <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('totalShoppingBudget').innerText = `$${shoppingSum}`;
            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
            lucide.createIcons();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-50', 'text-indigo-600', 'dark:bg-indigo-900/30', 'dark:text-indigo-400');
            });
            document.getElementById(`cat-${cat}`).classList.add('bg-indigo-50', 'text-indigo-600', 'dark:bg-indigo-900/30', 'dark:text-indigo-400');
            renderItems();
        }

        function openAddModal() {
            document.getElementById('itemForm').reset();
            document.getElementById('itemId').value = '';
            toggleFormFields();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function saveItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now().toString(),
                category: document.getElementById('itemCategory').value,
                name: document.getElementById('itemName').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                quantity: parseInt(document.getElementById('itemQuantity').value) || 1,
                billAmount: parseFloat(document.getElementById('billAmount').value) || 0,
                recurringType: document.getElementById('recurringType').value,
                dueDate: document.getElementById('dueDate').value,
                notes: document.getElementById('itemNotes').value,
                completed: false
            };

            itemsData.push(newItem);
            localStorage.setItem('smart_notes_data', JSON.stringify(itemsData));
            closeModal();
            renderItems();
        }

        function toggleComplete(id) {
            const item = itemsData.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                localStorage.setItem('smart_notes_data', JSON.stringify(itemsData));
                renderItems();
            }
        }

        function deleteItem(id) {
            if (confirm("確定要刪除此項目嗎？")) {
                itemsData = itemsData.filter(i => i.id !== id);
                localStorage.setItem('smart_notes_data', JSON.stringify(itemsData));
                renderItems();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(itemsData, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `Notes_Backup_${new Date().toISOString().slice(0,10)}.json`);
            anchor.click();
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
